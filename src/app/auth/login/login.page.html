<ion-content class="auth-content">
  <div class="auth-center">
  <div class="auth-wrap">
    <img src="assets/logo/rooster-logo.png" alt="Rooster logo" class="logo logo--lg" />
    <h1 class="brand">Rooster</h1>
    <p class="tagline">Tu comida favorita, al instante.</p>

    <form [formGroup]="form" (ngSubmit)="login()" class="auth-form">
      <div class="field">
        <label class="field__label">Correo electronico</label>
        <div class="input">
          <ion-icon name="mail-outline"></ion-icon>
          <input type="email" formControlName="email" placeholder="ejemplo@correo.com" autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <div class="field__row">
          <label class="field__label">Contrasena</label>
          <button type="button" class="link" (click)="irRecuperar()">Olvidaste tu contrasena?</button>
        </div>
        <div class="input">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="--------"
            autocomplete="current-password"
          />
          <button type="button" class="eye" (click)="showPassword = !showPassword">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary" [disabled]="cargando">
        <ng-container *ngIf="!cargando">
          Iniciar Sesion <ion-icon name="arrow-forward-outline"></ion-icon>
        </ng-container>
        <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
      </button>
    </form>

    <div class="switch">
      <span>No tienes cuenta?</span>
      <a class="link link--bold" (click)="irRegistro()">Crear cuenta</a>
    </div>

    <div class="divider"><span>O</span></div>

    <!-- Google: no es un XHR, navega fuera de la app y vuelve por el callback
         del backend (ver AuthService.irAGoogle). -->
    <button class="btn btn--google" (click)="entrarConGoogle()" [disabled]="cargando">
      <svg class="btn__google-logo" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.9 24.5c0-1.6-.1-3.2-.4-4.7H24v9h12.9c-.6 3-2.3 5.6-4.8 7.3l7.6 5.9c4.4-4.1 7.2-10.2 7.2-17.5z"/>
        <path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.2C1 16.4 0 20.1 0 24s1 7.6 2.6 10.8l7.9-6.2z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      Continuar con Google
    </button>

    <button class="btn btn--dark" (click)="entrarInvitado()">Iniciar sin registrarme</button>
  </div>
  </div>
</ion-content>

<!-- Item 19: Modal de cambio de contrasena expirada -->
<div class="pwd-modal" *ngIf="showPasswordModal">
  <div class="pwd-modal__backdrop" (click)="cerrarModalPassword()"></div>
  <div class="pwd-modal__panel">
    <div class="pwd-modal__head">
      <span class="pwd-modal__title">Actualiza tu contrasena</span>
      <button type="button" class="pwd-modal__close" (click)="cerrarModalPassword()">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>

    <form class="pwd-modal__body" [formGroup]="passwordModalForm" (ngSubmit)="cambiarPassword()">
      <div class="pwd-modal__msg">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        <p>{{ mensajeExpiracion }}</p>
      </div>

      <div class="pwd-field">
        <label class="pwd-field__label">Contrasena actual</label>
        <div class="pwd-input-wrap">
          <input class="pwd-input" [type]="showPasswordActual ? 'text' : 'password'"
            formControlName="password_actual" placeholder="Tu contrasena actual" />
          <button type="button" class="pwd-eye" (click)="showPasswordActual = !showPasswordActual">
            <ion-icon [name]="showPasswordActual ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <div class="pwd-field">
        <label class="pwd-field__label">Nueva contrasena</label>
        <div class="pwd-input-wrap">
          <input class="pwd-input" [type]="showPasswordNueva ? 'text' : 'password'"
            formControlName="password_nueva" placeholder="Minimo 8 caracteres" />
          <button type="button" class="pwd-eye" (click)="showPasswordNueva = !showPasswordNueva">
            <ion-icon [name]="showPasswordNueva ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <div class="pwd-field">
        <label class="pwd-field__label">Confirmar nueva contrasena</label>
        <div class="pwd-input-wrap">
          <input class="pwd-input" [type]="showPasswordConfirm ? 'text' : 'password'"
            formControlName="password_nueva_confirmation" placeholder="Repite la nueva contrasena" />
          <button type="button" class="pwd-eye" (click)="showPasswordConfirm = !showPasswordConfirm">
            <ion-icon [name]="showPasswordConfirm ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <button type="submit" class="pwd-modal__cta" [disabled]="passwordModalCargando">
        <ng-container *ngIf="!passwordModalCargando">Actualizar y continuar</ng-container>
        <ion-spinner *ngIf="passwordModalCargando" name="crescent"></ion-spinner>
      </button>
    </form>
  </div>
</div>
