<ion-content class="admin-page-content">
  <div class="admin-page">

    <admin-page-header
      title="Notificaciones"
      [subtitle]="noLeidas > 0 ? (noLeidas + ' sin leer') : 'Todo al día'">
      <button
        type="button"
        header-right
        class="notif-mark"
        [disabled]="noLeidas === 0 || marcandoTodas"
        (click)="marcarTodas()">
        Marcar todas como leídas
      </button>
    </admin-page-header>

    <!-- Cargando -->
    <div class="notif-empty" *ngIf="cargando">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- Vacío -->
    <div class="notif-empty" *ngIf="!cargando && notifs.length === 0">
      <ion-icon name="notifications-off-outline"></ion-icon>
      <p>No hay notificaciones todavía.</p>
    </div>

    <!-- Lista real -->
    <div class="notif-list" *ngIf="!cargando && notifs.length > 0">
      <button
        type="button"
        class="notif"
        *ngFor="let n of notifs"
        [class.notif--unread]="!n.leida"
        (click)="abrir(n)">
        <div class="notif__icon">
          <ion-icon [name]="icono(n)"></ion-icon>
        </div>
        <div class="notif__body">
          <p class="notif__text" [class.notif__text--unread]="!n.leida">{{ n.titulo }}</p>
          <p class="notif__sub">{{ n.mensaje }}</p>
          <p class="notif__time">{{ tiempo(n) }}</p>
        </div>
        <div class="notif__dot" *ngIf="!n.leida"></div>
      </button>
    </div>

  </div>
</ion-content>
