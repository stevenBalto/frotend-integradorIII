<ion-content class="admin-page-content">
  <div class="admin-page">

    <!-- Acciones del header (junto a la campana): marcar todas / borrar todas, SOLO
         íconos. Visibles en todo tamaño (el portal de acciones se ve también en móvil). -->
    <ng-template adminHeaderActions>
      <ng-container *ngIf="!cargando && notifs.length > 0">
        <button type="button" class="notif-act"
          [disabled]="noLeidas === 0 || marcandoTodas"
          (click)="marcarTodas()"
          title="Marcar todas como leídas" aria-label="Marcar todas como leídas">
          <ion-icon name="checkmark-done-outline"></ion-icon>
        </button>
        <button type="button" class="notif-act notif-act--danger"
          [disabled]="borrandoTodas"
          (click)="borrarTodas()"
          title="Borrar todas" aria-label="Borrar todas">
          <ion-icon name="trash-outline"></ion-icon>
        </button>
      </ng-container>
    </ng-template>

    <!-- Filtros (contador + Estado + Fecha) proyectados al header en tablet+. En
         móvil el slot del header se oculta y se muestran en el cuerpo (abajo). -->
    <ng-template adminHeaderLead>
      <div class="notif-filtros notif-filtros--head" *ngIf="!cargando && notifs.length > 0">
        <ng-container [ngTemplateOutlet]="filtrosTpl"></ng-container>
      </div>
    </ng-template>

    <!-- Cargando -->
    <div class="notif-empty" *ngIf="cargando">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- Vacío -->
    <div class="notif-empty" *ngIf="!cargando && notifs.length === 0">
      <ion-icon name="notifications-off-outline"></ion-icon>
      <p>No hay notificaciones todavía.</p>
    </div>

    <!-- Filtros en el cuerpo (solo móvil <640; en tablet+ viven en el header). -->
    <div class="notif-filtros notif-filtros--body" *ngIf="!cargando && notifs.length > 0">
      <ng-container [ngTemplateOutlet]="filtrosTpl"></ng-container>
    </div>

    <!-- Plantilla única de filtros, reutilizada por el header y por el cuerpo. -->
    <ng-template #filtrosTpl>
      <p class="notif-filtros__count">
        <strong>{{ notifsFiltradas.length }}</strong>
        notificaci{{ notifsFiltradas.length === 1 ? 'ón' : 'ones' }}
        <span class="notif-filtros__unread" *ngIf="noLeidas > 0">· {{ noLeidas }} sin leer</span>
      </p>
      <span class="notif-filtros__sep"></span>
      <div class="notif-filtros__grupo">
        <span class="notif-filtros__label">Estado</span>
        <div class="notif-filtros__chips">
          <button type="button" class="notif-chip" [class.notif-chip--on]="filtroEstado === 'todas'" (click)="filtroEstado = 'todas'">Todas</button>
          <button type="button" class="notif-chip" [class.notif-chip--on]="filtroEstado === 'no_leidas'" (click)="filtroEstado = 'no_leidas'">No leídas</button>
          <button type="button" class="notif-chip" [class.notif-chip--on]="filtroEstado === 'leidas'" (click)="filtroEstado = 'leidas'">Leídas</button>
        </div>
      </div>
      <div class="notif-filtros__grupo">
        <span class="notif-filtros__label">Fecha</span>
        <div class="notif-filtros__chips">
          <button type="button" class="notif-chip" *ngFor="let p of periodos"
            [class.notif-chip--on]="filtroPeriodo === p.v"
            (click)="filtroPeriodo = filtroPeriodo === p.v ? 'todas' : p.v">{{ p.l }}</button>
        </div>
      </div>
    </ng-template>


    <!-- Lista real (alto fijo con scroll interno) -->
    <div class="notif-list" *ngIf="!cargando && notifs.length > 0">
      <div
        class="notif"
        *ngFor="let n of notifsFiltradas"
        [class.notif--unread]="!n.leida"
        [class.notif--saliendo]="eliminandoIds.has(n.id)"
        (click)="abrir(n)">
        <div class="notif__icon">
          <ion-icon [name]="icono(n)"></ion-icon>
        </div>
        <div class="notif__body">
          <p class="notif__text" [class.notif__text--unread]="!n.leida">{{ n.titulo }}</p>
          <p class="notif__sub">{{ n.mensaje }}</p>
          <p class="notif__time">{{ tiempo(n) }}</p>
        </div>
        <div class="notif__dot" *ngIf="!n.leida"></div>
        <button type="button" class="notif__del" (click)="eliminar(n, $event)"
          aria-label="Eliminar notificación">
          <ion-icon name="trash-outline"></ion-icon>
        </button>
      </div>

      <p class="notif-filter-empty" *ngIf="notifsFiltradas.length === 0">
        No hay notificaciones con este filtro.
      </p>
    </div>

  </div>
</ion-content>
