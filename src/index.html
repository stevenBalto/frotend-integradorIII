<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Rooster Pizza & Grill</title>
  <meta
    name="description"
    content="Rooster Pizza & Grill: pizzas artesanales, carnes a la parrilla, pastas y bebidas. Mirá el menú y pedí en línea en La Fortuna, San Carlos."
  />

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/rooster-favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/logo/rooster-favicon-512.png" />
  <link rel="apple-touch-icon" href="assets/logo/rooster-favicon-180.png" />

  <!-- Fuentes: Playfair Display + Nunito (panel admin, --rooster-font-*, no tocar) -->
  <!-- Poppins + Inter (vista cliente, --client-font-*, identidad real de marca) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <style>
    /* Splash de arranque: se ve mientras Angular carga, se retira solo. */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #7a0f18 0%, #e13642 42%, #f2712c 72%, #f7a416 100%);
      background-size: 260% 260%;
      animation: rooster-splash-gradient 6s ease-in-out infinite;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #app-splash.app-splash--hide { opacity: 0; visibility: hidden; pointer-events: none; }

    #app-splash::before,
    #app-splash::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.35;
      background: radial-gradient(circle at 30% 30%, rgba(255, 214, 130, 0.9), rgba(255, 214, 130, 0) 70%);
      animation: rooster-splash-float 9s ease-in-out infinite;
    }
    #app-splash::before { width: 320px; height: 320px; top: -80px; left: -60px; }
    #app-splash::after { width: 260px; height: 260px; bottom: -70px; right: -50px; animation-delay: -4.5s; }

    .app-splash__logo-wrap {
      position: relative;
      width: 128px;
      height: 128px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }
    .app-splash__ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 68%);
      animation: rooster-splash-pulse 2.2s ease-out infinite;
    }
    .app-splash__logo {
      position: relative;
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
      animation: rooster-splash-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .app-splash__name {
      margin: 0;
      /* Fuentes de sistema en el splash: Playfair/Nunito son del panel admin y,
         usadas aquí, forzaban ~76KB de descarga de fuentes en la home del
         cliente. El splash es momentáneo; system serif/sans se ve igual de bien
         y no bloquea ni descarga nada. */
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 0.02em;
      color: #fff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.25);
      opacity: 0;
      animation: rooster-splash-rise 0.6s ease-out 0.35s forwards;
      text-align: center;
      padding: 0 24px;
    }
    .app-splash__tag {
      margin: 6px 0 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      opacity: 0;
      animation: rooster-splash-rise 0.6s ease-out 0.55s forwards;
    }
    .app-splash__dots { display: flex; gap: 7px; margin-top: 30px; }
    .app-splash__dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.5;
      animation: rooster-splash-dot 1.1s ease-in-out infinite;
    }
    .app-splash__dots span:nth-child(2) { animation-delay: 0.15s; }
    .app-splash__dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes rooster-splash-gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes rooster-splash-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, -14px) scale(1.08); }
    }
    @keyframes rooster-splash-pulse {
      0% { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    @keyframes rooster-splash-pop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes rooster-splash-rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes rooster-splash-dot {
      0%, 100% { opacity: 0.35; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash, #app-splash::before, #app-splash::after,
      .app-splash__ring, .app-splash__logo, .app-splash__name,
      .app-splash__tag, .app-splash__dots span { animation: none !important; opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="app-splash">
    <div class="app-splash__logo-wrap">
      <div class="app-splash__ring"></div>
      <img class="app-splash__logo" src="assets/logo/rooster-favicon-180.png" alt="Rooster Pizza & Grill" width="96" height="96" />
    </div>
    <p class="app-splash__name">Rooster Pizza &amp; Grill</p>
    <p class="app-splash__tag">Pizza &amp; Grill</p>
    <div class="app-splash__dots"><span></span><span></span><span></span></div>
  </div>

  <app-root></app-root>

  <script>
    (function () {
      var splash = document.getElementById('app-splash');
      if (!splash) return;
      var start = Date.now();
      var minVisible = 300;
      var hidden = false;

      function hide() {
        if (hidden) return;
        hidden = true;
        var wait = Math.max(0, minVisible - (Date.now() - start));
        setTimeout(function () {
          splash.classList.add('app-splash--hide');
          setTimeout(function () { splash.remove(); }, 650);
        }, wait);
      }

      var root = document.querySelector('app-root');
      if (root && root.childNodes.length > 0) {
        hide();
      } else if (root) {
        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            observer.disconnect();
            hide();
          }
        });
        observer.observe(root, { childList: true });
      }
      // Salvavidas: si algo falla, no dejar el splash trabado para siempre.
      setTimeout(hide, 6000);
    })();
  </script>
</body>

</html>
